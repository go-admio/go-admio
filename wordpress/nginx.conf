charset utf-8;
autoindex off;

# Static assets — 7 day cache + CORS (as in your original)
location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|css|js|pdf)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*" always;
}

location / {
    try_files $uri $uri/ /index.php?$args;
}
